
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green AI Crop Doctor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🌱 Green AI Crop Doctor</h1>
        <p>Potato Leaf Disease Detection</p>
    </header>

    <main>
        <section class="upload-section">
            <h2>Upload a Potato Leaf Image</h2>
            <p>Select a clear image of a potato leaf to check its condition.</p>

            <input type="file" id="imageInput" accept="image/*">
            <div id="imagePreview"></div>

            <button id="predictButton">Analyze Leaf</button>
            <div id="result"></div>
        </section>
    </main>

    <footer>
        <p>Educational screening tool — not a confirmed agricultural diagnosis.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
